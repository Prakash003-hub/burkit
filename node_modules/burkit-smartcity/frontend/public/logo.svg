<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <!-- Inner Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <!-- Accent Gold -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ffffff" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />

  <!-- Glassmorphic Overlay Circle -->
  <circle cx="256" cy="256" r="210" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="3" stroke-opacity="0.3" />

  <!-- Smart City Buildings Silhouette -->
  <g fill="#ffffff" fill-opacity="0.2">
    <rect x="110" y="240" width="45" height="120" rx="4" />
    <rect x="165" y="190" width="55" height="170" rx="6" />
    <rect x="230" y="150" width="70" height="210" rx="8" />
    <rect x="310" y="210" width="50" height="150" rx="6" />
    <rect x="370" y="260" width="40" height="100" rx="4" />
  </g>

  <!-- Central Emblem: Smart City Location Pin + Branding -->
  <g filter="url(#dropShadow)">
    <!-- Location Pin Outline -->
    <path d="M 256,90 C 180,90 120,150 120,226 C 120,310 230,410 256,430 C 282,410 392,310 392,226 C 392,150 332,90 256,90 Z" fill="#ffffff" />
    <!-- Pin Inner Core -->
    <circle cx="256" cy="220" r="85" fill="#18181b" />
  </g>

  <!-- Wi-Fi & Smart Signal Waves at Top of Pin -->
  <g stroke="url(#accentGrad)" stroke-width="7" fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M 226,170 A 40,40 0 0,1 286,170" />
    <path d="M 210,150 A 62,62 0 0,1 302,150" />
  </g>

  <!-- Letter B for BURKIT -->
  <text x="256" y="252" font-family="'Poppins', 'Inter', sans-serif" font-weight="900" font-size="95" text-anchor="middle" fill="url(#accentGrad)" filter="url(#glow)">B</text>

  <!-- Stars / Sparkles -->
  <path d="M 130,130 L 135,145 L 150,150 L 135,155 L 130,170 L 125,155 L 110,150 L 125,145 Z" fill="url(#accentGrad)" opacity="0.9" />
  <path d="M 380,120 L 384,132 L 396,136 L 384,140 L 380,152 L 376,140 L 364,136 L 376,132 Z" fill="#ffffff" opacity="0.8" />
</svg>
